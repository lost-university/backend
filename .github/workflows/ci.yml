name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # deploy commits only change the pinned image tags, they don't need a release
    paths-ignore:
      - 'deployment/**'

# runs on main are queued instead of running in parallel, so releases and deploys happen in merge order
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIN_COVERAGE: 95

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install dependencies
        working-directory: service
        run: uv sync --frozen --no-cache
      - name: Run ruff format
        working-directory: service
        run: uv run ruff format --check
      - name: Run ruff check
        working-directory: service
        run: uv run ruff check
      - name: Set Envs
        run: |
          echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
          echo "POSTGRES_PORT=5432" >> $GITHUB_ENV
          echo "POSTGRES_USER=postgres" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=postgres" >> $GITHUB_ENV
          echo "POSTGRES_DB=postgres" >> $GITHUB_ENV
          echo "AUTHORIZED_PARTIES=http://localhost" >> $GITHUB_ENV
      - name: Run tests
        working-directory: service
        run: uv run pytest --cov=app --cov-report=html
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: service/htmlcov
      - name: Check coverage
        working-directory: service
        run: uv run coverage report --fail-under=$MIN_COVERAGE

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          last=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$last" ]; then next=1.0.0; else next="${last%.*}.$(( ${last##*.} + 1 ))"; fi
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" --generate-notes
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=ref,event=branch
            type=sha,format=long
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Pin image tag
        working-directory: deployment
        run: kustomize edit set image ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag }}
      - name: Commit and push
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git commit -am "Deploy backend $TAG"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          exit 1
