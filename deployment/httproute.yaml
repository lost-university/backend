apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lost-university-route
  namespace: lost-university
spec:
  parentRefs:
    - name: gateway-shared
      namespace: envoy-gateway-system
  hostnames:
    - lost.university
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: frontend
          port: 80
    - matches:
      - path:
          type: PathPrefix
          value: /api/
      backendRefs:
        - name: backend
          port: 80